<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusão de Livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4 text-center fw-bold">Exclusão de Livro</h1>
        <form id="bookForm">
            <div class="mb-3">
                <label for="title" class="form-label fw-bold">Título</label>
                <input type="text" class="form-control" id="title" required>
            </div>

            
            <button type="submit" class="btn btn-danger fw-bold" id="btn">Excluir 🗑️</button>
        </form>
        
        <div id="mensagemSucesso" class="alert alert-success d-none mt-3 text-center fw-bold" role="alert"></div>
        <div id="mensagemErro" class="alert alert-danger d-none mt-3 text-center fw-bold" role="alert"></div>
    </div>
    <script src="scripts/deletarLivro.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
