<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Usuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/profile.css">
</head>
<body class="bg-light">
  <div class="container mt-5 px-3 px-md-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="fw-bold">👤 Meu Perfil</h1>
      <a href="index.html" class="btn btn-outline-dark fw-bold">📖 Voltar para o Acervo</a>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body" id="profile-info">
        <div class="card shadow-sm mb-4 p-3 bg-light">
          <div class="d-flex align-items-center gap-4">
            
            <label for="imageInput" class="position-relative d-inline-block" style="cursor: pointer;">
              <img id="profilePic" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" 
                   alt="Foto de perfil" class="rounded-circle border" width="80" height="80">
              <span class="position-absolute bottom-0 end-0 bg-dark text-white rounded-circle p-1" 
                    style="font-size: 0.75rem;">✏️</span>
            </label>

            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <div>
              <h4 class="mb-1 fw-bold" id="username">Usuário</h4>
              <p class="mb-0 text-muted" id="userEmail">email@exemplo.com</p>
              <span class="badge bg-secondary mt-2" id="userRole">Perfil</span>
            </div>
          </div>
          <p class="mt-2 fw-bold mb-0" id="favoriteGenre">Gênero Favorito: Gênero</p>
        
          <div>
            <div class="d-flex flex-wrap gap-2">
              <div id="adminAuthor" class="d-flex gap-2"></div>
              <div id="adminBook" class="d-flex gap-2"></div>
            </div>
          </div>
        </div>



    <h2 class="fw-semibold fs-4 mb-3"><strong>📖 Minha Biblioteca</strong></h2>

    <div class="row g-3" id="bookList"></div>


  </div>
  <script src="scripts/user/pages/profile.js" type="module"></script>
</body>
</html>
