<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo - Biblioteca Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/index.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">📖 Acervo - Biblioteca Virtual</h1>
    
            <div class="d-flex gap-2 align-items-center">
                <div class="d-flex gap-2" id="adminAuthor"></div>
                <div class="d-flex gap-2" id="adminBook"></div>
        
                <a href="profile.html" class="btn btn-outline-dark fw-bold">👤 Meu Perfil</a>
                <a href="login.html" class="btn btn-outline-dark fw-bold">❌ Sair</a>
            </div>
        </div>
    
        <div class="row g-3 mb-3">
            <div class="col-sm-12 col-md-4">
                <div class="input-group">
                    <input type="text" class="form-control" id="search" placeholder="Buscar por título">
                    <button class="btn btn-dark fw-bold" id="searchBtn">Buscar 🔎</button>
                </div>
            </div>
    
            <div class="col-sm-12 col-md-4">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchAuthor" placeholder="Buscar por Autor">
                    <button class="btn btn-dark fw-bold" id="searchBtnAuthor">Buscar 🔎</button>
                </div>
            </div>
    
            <div class="col-sm-12 col-md-4">
                <div class="input-group">
                    <select class="form-select" id="genre" required>
                        <option value="">Buscar por Gênero</option>
                        <option value="FICTION">Ficção 🛸</option>
                        <option value="FANTASY">Fantasia 🧙‍♂️</option>
                        <option value="MYSTERY">Mistério 🕵️‍♀️</option>
                        <option value="THRILLER">Terror 👻</option>
                        <option value="HISTORY">História 🏺</option>
                        <option value="ROMANCE">Romance ❤️</option>
                        <option value="ADVENTURE">Aventura 🗺️</option>
                        <option value="SCIENCE">Ciência 🔬</option>
                        <option value="PHILOSOPHY">Filosofia 🧠</option>
                    </select>
                    <button class="btn btn-dark fw-bold" id="searchBtnGenre">Buscar 🔎</button>
                </div>
            </div>
        </div>
    
        <div id="book-list" class="container mt-4">
            <div class="row g-3" id="bookRow"></div>
        </div>
    
        <nav>
            <ul id="pagination" class="pagination justify-content-center mt-4"></ul>
        </nav>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/index.js" type="module"></script>
</body>
</html>
